# Frozen recipe configuration for Second v1.1 (Phase 11 & Phase 12)
model_name: "Second-1.1-9B"
version: "1.1"
size: "9B"
base_model: "Qwen/Qwen3.5-9B"
fact_extractor_version: "1.1"
reward_version: "v3"
base_model_family: "Qwen/Qwen3.5"

mode:
  text_only: true
  enable_thinking: false

sft:
  method: "lora"
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules: "all-linear"
  train_data_path: "data/processed/sft_v1_1_train.jsonl"
  val_data_path: "data/processed/sft_v1_1_val.jsonl"
  testset_path: "eval/testset-1.1.jsonl"
  max_examples: 20000
  num_train_epochs: 2
  learning_rate: 0.0001
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  max_seq_length: 1024
  loss_on_answer_only: true
  save_steps: 200
  checkpoint_dir: "/content/drive/MyDrive/second/checkpoints/sft-1.1-9b"

# Open-weight self-training and distillation policy (no Gemini or proprietary APIs)
rft:
  allowed_generator_models:
    - "Qwen/Qwen3.5-27B"
    - "Qwen/Qwen3.5-9B"
  default_generator_model: "Qwen/Qwen3.5-27B"
  backend: "vllm"
  pipeline_module: "data/pipeline/rft_v1_1.py"
  min_reward_gate: 0.82
  min_key_point_gate: 0.75
  min_better_move_gate: 1.00
  min_not_copied_gate: 0.85

# Top-down Phase 12 training order: flagship first, then distilled browser models
training_chain:
  flagship_candidates:
    - "Qwen/Qwen3.5-27B"   # Use on 80 GB A100 if budget fits
    - "Qwen/Qwen3.5-9B"    # Full SFT + GRPO fallback on 40 GB A100
  browser_models:
    - "2B"
    - "0.8B"
    - "4B"

grpo:
  sft_adapter_dir: "/content/drive/MyDrive/second/checkpoints/sft-1.1-9b/final_adapter"
  rl_prompts_path: "data/processed/rl_prompts_v1_1.jsonl"
  val_data_path: "data/processed/sft_v1_1_val.jsonl"
  devset_path: "eval/devset-1.1.jsonl"
  testset_path: "eval/testset-1.1.jsonl"
  loss_type: "dapo"
  multi_objective_aggregation: "normalize_then_sum"
  reward_version: "v3"
  hard_checks_count: 11
  num_generations: 8
  max_completion_length: 300
  max_prompt_length: 512
  temperature: 0.9
  learning_rate: 0.000005
  beta: 0.02
  max_steps: 250
  warmup_steps: 25
  save_steps: 50
  eval_steps: 50
  logging_steps: 10
  save_total_limit: 3
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 1
  gpu: "A100"
  checkpoint_dir: "/content/drive/MyDrive/second/checkpoints/grpo-1.1-9b"

evaluation:
  devset_path: "eval/devset-1.1.jsonl"
  testset_path: "eval/testset-1.1.jsonl"
  devset_count: 160
  testset_count: 320
  zero_contamination_verified: true
