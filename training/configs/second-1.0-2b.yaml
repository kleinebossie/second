# Recipe configuration for Second-1.0-2B (Phase 5 SFT and Phase 6 GRPO)
model_name: "Second-1.0-2B"
version: "1.0"
size: "2B"
base_model: "Qwen/Qwen3.5-2B"

mode:
  text_only: true
  enable_thinking: false

sft:
  method: "lora"
  lora_r: 32
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: "all-linear"
  train_data_path: "data/processed/sft_train.jsonl"
  val_data_path: "data/processed/sft_val.jsonl"
  testset_path: "eval/testset-1.0.jsonl"
  max_examples: 20000
  num_train_epochs: 2
  learning_rate: 0.0001
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  max_seq_length: 1024
  loss_on_answer_only: true
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 2
  save_strategy: "steps"
  save_steps: 200
  eval_strategy: "steps"
  eval_steps: 200
  logging_steps: 25
  bf16: true
  gpu: "L4"
  checkpoint_dir: "/content/drive/MyDrive/second/checkpoints/sft-1.0-2b"

grpo:
  num_generations: 8
  max_completion_length: 300
  temperature: 0.9
  learning_rate: 0.000005
  beta: 0.02
  max_steps: 500
  save_steps: 50
  gpu: "L4"
  checkpoint_dir: "/content/drive/MyDrive/second/checkpoints/grpo-1.0-2b"
