<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="Second — Your local chess second social preview">
  <defs>
    <linearGradient id="sp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16181e"/>
      <stop offset="50%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#0e1015"/>
    </linearGradient>
    <radialGradient id="sp-glow-gold" cx="0.24" cy="0.38" r="0.45">
      <stop offset="0%" stop-color="#e5c07b" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#121316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sp-glow-emerald" cx="0.80" cy="0.72" r="0.40">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#121316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sp-mark-bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#1e212b"/>
      <stop offset="100%" stop-color="#121316"/>
    </linearGradient>
    <linearGradient id="sp-mark-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e5c07b" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="sp-gold" x1="0.18" y1="0.05" x2="0.82" y2="0.95">
      <stop offset="0%" stop-color="#f5eedc"/>
      <stop offset="28%" stop-color="#e5c07b"/>
      <stop offset="100%" stop-color="#c39441"/>
    </linearGradient>
    <pattern id="sp-grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#ffffff" fill-opacity="0.016"/>
      <rect x="40" y="40" width="40" height="40" fill="#ffffff" fill-opacity="0.016"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#sp-bg)"/>
  <rect width="1280" height="640" fill="url(#sp-grid)"/>
  <rect width="1280" height="640" fill="url(#sp-glow-gold)"/>
  <rect width="1280" height="640" fill="url(#sp-glow-emerald)"/>

  <!-- Left Editorial Identity -->
  <g transform="translate(84, 114) scale(1.06)">
    <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#sp-mark-bg)"/>
    <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="url(#sp-mark-rim)" stroke-width="2"/>
    <path fill="url(#sp-gold)" d="
      M 60 18 L 67.5 26.5 C 85.5 28.8, 96.5 41.5, 94.5 59 C 92.6 72.5, 81.5 81.5, 62.5 89
      L 36.5 89 C 40.5 77.2, 56 67.5, 67.5 56 C 72.5 51, 70.5 43, 62.5 41.5
      C 56.5 40.5, 51.5 44.5, 48.5 50.5 L 37.5 57.5 C 31.8 59.5, 27.5 54.8, 30.2 48.8
      L 40.5 34.8 C 44.5 29.8, 50 26.5, 56 25.5 Z
    "/>
    <path fill="#16181e" d="M 45.8 38.6 L 51.2 37.0 L 49.4 41.8 Z"/>
    <path fill="#f1ebd9" opacity="0.12" d="M 92.0 68.5 C 92.0 76.5, 89.2 83.8, 86.0 89 L 70.0 89 C 79.6 83.2, 87.2 76.4, 92.0 68.5 Z"/>
    <rect x="34.5" y="95" width="46.5" height="9.5" rx="3" fill="#f1ebd9"/>
    <rect x="85" y="95" width="9.5" height="9.5" rx="3" fill="#34d399"/>
  </g>

  <text x="86" y="330" fill="#ffffff" font-family="'Inter', 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="82" font-weight="700" letter-spacing="-2.2">Second</text>
  <text x="88" y="378" fill="#e5c07b" font-family="'Inter', 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="600">Your local chess second.</text>
  <text x="88" y="424" fill="#94a3b8" font-family="'Inter', 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19">Plain-English chess move commentary on your device.</text>
  <text x="88" y="452" fill="#94a3b8" font-family="'Inter', 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19">Private Chrome side panel for post-game Lichess study.</text>

  <!-- Bottom Feature Badges -->
  <g transform="translate(88, 496)">
    <rect x="0" y="0" width="160" height="38" rx="9" fill="#1c1f28" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <rect x="14" y="14" width="10" height="10" rx="2.5" fill="#34d399"/>
    <text x="33" y="24" fill="#f1ebd9" font-family="ui-monospace, 'Ubuntu Mono', 'Liberation Mono', monospace" font-size="13.5" font-weight="600">Local WASM AI</text>

    <rect x="174" y="0" width="186" height="38" rx="9" fill="#1c1f28" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <rect x="188" y="14" width="10" height="10" rx="2.5" fill="#e5c07b"/>
    <text x="207" y="24" fill="#f1ebd9" font-family="ui-monospace, 'Ubuntu Mono', 'Liberation Mono', monospace" font-size="13.5" font-weight="600">Post-Game Locked</text>

    <rect x="374" y="0" width="142" height="38" rx="9" fill="#1c1f28" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <rect x="388" y="14" width="10" height="10" rx="2.5" fill="#f1ebd9"/>
    <text x="407" y="24" fill="#f1ebd9" font-family="ui-monospace, 'Ubuntu Mono', 'Liberation Mono', monospace" font-size="13.5" font-weight="600">Open Source</text>
  </g>

  <!-- Right Sidepanel UI Showcase Card -->
  <g transform="translate(706, 86)">
    <rect x="0" y="0" width="490" height="468" rx="18" fill="#121316" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <path d="M 1 18 C 1 8.6 8.6 1 18 1 L 472 1 C 481.4 1 489 8.6 489 18 L 489 56 L 1 56 Z" fill="#16181e"/>
    <line x1="1" y1="56" x2="489" y2="56" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <g transform="translate(20, 17) scale(0.92)">
      <path fill="#e5c07b" d="
        M 11.2 2.2 L 12.8 3.9 C 16.8 4.4, 19.2 7.2, 18.8 11.0 C 18.4 13.9, 16.0 15.9, 11.8 17.5
        L 6.1 17.5 C 7.0 15.0, 10.4 12.9, 12.9 10.4 C 14.0 9.3, 13.5 7.6, 11.8 7.3
        C 10.5 7.1, 9.4 7.9, 8.7 9.2 L 6.3 10.7 C 5.1 11.1, 4.1 10.1, 4.7 8.8
        L 7.0 5.8 C 7.8 4.7, 9.0 4.0, 10.4 3.8 Z
      "/>
      <circle cx="8.5" cy="6.8" r="0.65" fill="#16181e"/>
      <rect x="5.7" y="18.8" width="10.1" height="2.2" rx="0.7" fill="#f1ebd9"/>
      <rect x="16.7" y="18.8" width="2.2" height="2.2" rx="0.7" fill="#34d399"/>
    </g>
    <text x="50" y="33" fill="#ffffff" font-family="'Inter', 'Lato', sans-serif" font-size="15.5" font-weight="600">Second</text>
    <line x1="116" y1="20" x2="116" y2="36" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
    <text x="128" y="32" fill="#34d399" font-family="ui-monospace, 'Ubuntu Mono', monospace" font-size="12.5">Ready</text>

    <rect x="348" y="14" width="120" height="28" rx="7" fill="#252834" stroke="#363b4c" stroke-width="1"/>
    <text x="408" y="32" text-anchor="middle" fill="#ffffff" font-family="'Inter', 'Lato', sans-serif" font-size="12.5" font-weight="500">Explain Move</text>

    <!-- Move Title Header -->
    <text x="24" y="96" font-family="ui-monospace, 'Ubuntu Mono', 'Liberation Mono', monospace" font-size="17">
      <tspan fill="#ffffff" font-weight="700">14. Nd5</tspan>
      <tspan fill="rgba(255,255,255,0.28)"> · </tspan>
      <tspan fill="#34d399" font-weight="600">Best move</tspan>
    </text>
    <text x="466" y="96" text-anchor="end" fill="#8e8a83" font-family="ui-monospace, 'Ubuntu Mono', 'Liberation Mono', monospace" font-size="12.5">Second 2B</text>
    <line x1="0" y1="114" x2="490" y2="114" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

    <!-- Collapsible Think Pill -->
    <rect x="24" y="134" width="442" height="36" rx="8" fill="rgba(229,192,123,0.05)" stroke="rgba(229,192,123,0.18)" stroke-width="1"/>
    <text x="38" y="156" font-family="'Inter', 'Lato', sans-serif" font-size="13">
      <tspan fill="#e5c07b" font-family="ui-monospace, 'Ubuntu Mono', monospace" font-size="12" font-weight="600">&lt;think&gt;</tspan>
      <tspan fill="#94a3b8" dx="8">Reasoning trace</tspan>
    </text>
    <text x="450" y="156" text-anchor="end" fill="#94a3b8" font-family="sans-serif" font-size="12">▾</text>

    <!-- Editorial Commentary Text using tspan -->
    <text x="24" y="210" fill="#f1ebd9" font-family="'Inter', 'Lato', sans-serif" font-size="17" font-weight="600">
      <tspan>Places the </tspan><tspan fill="#ffffff" font-weight="700">knight</tspan><tspan> on a strong outpost at </tspan><tspan fill="#cbd5e1" font-family="ui-monospace, 'Ubuntu Mono', monospace" text-decoration="underline">d5</tspan><tspan>.</tspan>
    </text>

    <text x="24" y="252" fill="#e2e8f0" font-family="'Inter', 'Lato', sans-serif" font-size="15">
      <tspan>This jump attacks the defender on </tspan><tspan fill="#cbd5e1" font-family="ui-monospace, 'Ubuntu Mono', monospace" text-decoration="underline">f6</tspan><tspan> and opens</tspan>
    </text>
    <text x="24" y="280" fill="#e2e8f0" font-family="'Inter', 'Lato', sans-serif" font-size="15">
      <tspan>the </tspan><tspan fill="#cbd5e1" font-family="ui-monospace, 'Ubuntu Mono', monospace" text-decoration="underline">e-file</tspan><tspan> for your rook. After </tspan><tspan fill="#e5c07b" font-family="ui-monospace, 'Ubuntu Mono', monospace" font-weight="600" text-decoration="underline">14...Nxd5 15. exd5</tspan><tspan>,</tspan>
    </text>
    <text x="24" y="308" fill="#e2e8f0" font-family="'Inter', 'Lato', sans-serif" font-size="15">
      <tspan>White gains clear space and targets the </tspan><tspan fill="#cbd5e1" font-family="ui-monospace, 'Ubuntu Mono', monospace" text-decoration="underline">e7</tspan><tspan> pawn.</tspan>
    </text>

    <!-- Floating Island Dock -->
    <rect x="24" y="392" width="442" height="52" rx="12" fill="#16181e" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <rect x="36" y="403" width="76" height="30" rx="7" fill="#1c1f28" stroke="#363b4c" stroke-width="1"/>
    <text x="74" y="422" text-anchor="middle" fill="#e2e8f0" font-family="'Inter', 'Lato', sans-serif" font-size="12.5" font-weight="500">Longer</text>
    <circle cx="132" cy="418" r="4" fill="#34d399"/>
    <text x="144" y="422" fill="#94a3b8" font-family="ui-monospace, 'Ubuntu Mono', monospace" font-size="11.5">Local WASM · Stockfish</text>
    <rect x="388" y="403" width="32" height="30" rx="7" fill="transparent" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <path d="M 401 424 v -7 l 3 -5 a 1.5 1.5 0 0 1 2.5 1 v 3 h 3.5 a 1.5 1.5 0 0 1 1.5 1.8 l -1 4.5 a 1.5 1.5 0 0 1 -1.5 1.2 z M 398 417 v 7" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="426" y="403" width="32" height="30" rx="7" fill="transparent" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <path d="M 439 412 v 7 l 3 5 a 1.5 1.5 0 0 0 2.5 -1 v -3 h 3.5 a 1.5 1.5 0 0 0 1.5 -1.8 l -1 -4.5 a 1.5 1.5 0 0 0 -1.5 -1.2 z M 436 419 v -7" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
