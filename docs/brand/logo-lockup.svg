<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 436 136" role="img" aria-label="Second — Your local chess second">
  <defs>
    <linearGradient id="lockup-canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16181e"/>
      <stop offset="100%" stop-color="#121316"/>
    </linearGradient>
    <linearGradient id="lockup-mark-bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#1e212b"/>
      <stop offset="100%" stop-color="#121316"/>
    </linearGradient>
    <linearGradient id="lockup-mark-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e5c07b" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="lockup-gold" x1="0.18" y1="0.05" x2="0.82" y2="0.95">
      <stop offset="0%" stop-color="#f5eedc"/>
      <stop offset="28%" stop-color="#e5c07b"/>
      <stop offset="100%" stop-color="#c39441"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="434" height="134" rx="22" fill="url(#lockup-canvas)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Embedded Master Mark (scaled to 92x92 at x=22, y=22) -->
  <g transform="translate(22, 22) scale(0.71875)">
    <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#lockup-mark-bg)"/>
    <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="url(#lockup-mark-rim)" stroke-width="2.2"/>
    <path fill="url(#lockup-gold)" d="
      M 60 18 L 67.5 26.5 C 85.5 28.8, 96.5 41.5, 94.5 59 C 92.6 72.5, 81.5 81.5, 62.5 89
      L 36.5 89 C 40.5 77.2, 56 67.5, 67.5 56 C 72.5 51, 70.5 43, 62.5 41.5
      C 56.5 40.5, 51.5 44.5, 48.5 50.5 L 37.5 57.5 C 31.8 59.5, 27.5 54.8, 30.2 48.8
      L 40.5 34.8 C 44.5 29.8, 50 26.5, 56 25.5 Z
    "/>
    <path fill="#16181e" d="M 45.8 38.6 L 51.2 37.0 L 49.4 41.8 Z"/>
    <path fill="#f1ebd9" opacity="0.12" d="M 92.0 68.5 C 92.0 76.5, 89.2 83.8, 86.0 89 L 70.0 89 C 79.6 83.2, 87.2 76.4, 92.0 68.5 Z"/>
    <rect x="34.5" y="95" width="46.5" height="9.5" rx="3" fill="#f1ebd9"/>
    <rect x="85" y="95" width="9.5" height="9.5" rx="3" fill="#34d399"/>
  </g>

  <!-- Wordmark & Tagline -->
  <text x="134" y="64" fill="#ffffff" font-family="'Inter', 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="700" letter-spacing="-1.2">Second</text>
  <text x="135" y="90" fill="#e5c07b" font-family="'Inter', 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="500" letter-spacing="0.1">Your local chess second.</text>
  <rect x="135" y="104" width="7" height="7" rx="2" fill="#34d399"/>
  <text x="149" y="111" fill="#8e8a83" font-family="ui-monospace, 'SFMono-Regular', 'Ubuntu Mono', 'Liberation Mono', monospace" font-size="11" font-weight="600" letter-spacing="1.0">ON-DEVICE AI · POST-GAME ONLY</text>
