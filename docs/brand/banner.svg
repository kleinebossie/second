<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Second — Your local chess second banner">
  <defs>
    <linearGradient id="banner-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16181e"/>
      <stop offset="55%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#0e1015"/>
    </linearGradient>
    <radialGradient id="banner-glow" cx="0.22" cy="0.48" r="0.45">
      <stop offset="0%" stop-color="#e5c07b" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#121316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="banner-mark-bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#1e212b"/>
      <stop offset="100%" stop-color="#121316"/>
    </linearGradient>
    <linearGradient id="banner-mark-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e5c07b" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="banner-gold" x1="0.18" y1="0.05" x2="0.82" y2="0.95">
      <stop offset="0%" stop-color="#f5eedc"/>
      <stop offset="28%" stop-color="#e5c07b"/>
      <stop offset="100%" stop-color="#c39441"/>
    </linearGradient>
    <pattern id="chess-grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#ffffff" fill-opacity="0.018"/>
      <rect x="32" y="32" width="32" height="32" fill="#ffffff" fill-opacity="0.018"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="318" rx="20" fill="url(#banner-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <rect x="1" y="1" width="1198" height="318" rx="20" fill="url(#chess-grid)"/>
  <rect x="1" y="1" width="1198" height="318" rx="20" fill="url(#banner-glow)"/>

  <!-- Left Brand Column -->
  <g transform="translate(52, 62) scale(0.92)">
    <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#banner-mark-bg)"/>
    <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="url(#banner-mark-rim)" stroke-width="2"/>
    <path fill="url(#banner-gold)" d="
      M 60 18 L 67.5 26.5 C 85.5 28.8, 96.5 41.5, 94.5 59 C 92.6 72.5, 81.5 81.5, 62.5 89
      L 36.5 89 C 40.5 77.2, 56 67.5, 67.5 56 C 72.5 51, 70.5 43, 62.5 41.5
      C 56.5 40.5, 51.5 44.5, 48.5 50.5 L 37.5 57.5 C 31.8 59.5, 27.5 54.8, 30.2 48.8
      L 40.5 34.8 C 44.5 29.8, 50 26.5, 56 25.5 Z
    "/>
    <path fill="#16181e" d="M 45.8 38.6 L 51.2 37.0 L 49.4 41.8 Z"/>
    <path fill="#f1ebd9" opacity="0.12" d="M 92.0 68.5 C 92.0 76.5, 89.2 83.8, 86.0 89 L 70.0 89 C 79.6 83.2, 87.2 76.4, 92.0 68.5 Z"/>
    <rect x="34.5" y="95" width="46.5" height="9.5" rx="3" fill="#f1ebd9"/>
    <rect x="85" y="95" width="9.5" height="9.5" rx="3" fill="#34d399"/>
  </g>

  <text x="192" y="118" fill="#ffffff" font-family="'Inter', 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="700" letter-spacing="-1.5">Second</text>
  <text x="194" y="152" fill="#e5c07b" font-family="'Inter', 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="600">Your local chess second.</text>
  <text x="194" y="182" fill="#94a3b8" font-family="'Inter', 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">Plain-English move explanations on your device. Built for Lichess study.</text>

  <!-- Feature Pills -->
  <g transform="translate(194, 212)">
    <rect x="0" y="0" width="146" height="32" rx="8" fill="#1c1f28" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
    <rect x="13" y="12" width="8" height="8" rx="2" fill="#34d399"/>
    <text x="29" y="20.5" fill="#e2e8f0" font-family="ui-monospace, 'Ubuntu Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600">100% On-Device</text>

    <rect x="158" y="0" width="146" height="32" rx="8" fill="#1c1f28" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
    <rect x="171" y="12" width="8" height="8" rx="2" fill="#e5c07b"/>
    <text x="187" y="20.5" fill="#e2e8f0" font-family="ui-monospace, 'Ubuntu Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600">Post-Game Only</text>

    <rect x="316" y="0" width="120" height="32" rx="8" fill="#1c1f28" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
    <rect x="329" y="12" width="8" height="8" rx="2" fill="#f1ebd9"/>
    <text x="345" y="20.5" fill="#e2e8f0" font-family="ui-monospace, 'Ubuntu Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600">Open Source</text>
  </g>

  <!-- Right Column: Monograph Editorial Commentary Preview Card -->
  <g transform="translate(694, 42)">
    <rect x="0" y="0" width="454" height="236" rx="14" fill="#16181e" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>
    <path d="M 1 14 C 1 6.8 6.8 1 14 1 L 440 1 C 447.2 1 453 6.8 453 14 L 453 46 L 1 46 Z" fill="#1c1f28"/>
    <line x1="1" y1="46" x2="453" y2="46" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="20" y="29" font-family="ui-monospace, 'Ubuntu Mono', 'Liberation Mono', monospace" font-size="14">
      <tspan fill="#ffffff" font-weight="700">14. Nd5</tspan>
      <tspan fill="rgba(255,255,255,0.30)"> · </tspan>
      <tspan fill="#34d399" font-weight="600">Best move</tspan>
    </text>
    <text x="432" y="29" text-anchor="end" fill="#8e8a83" font-family="ui-monospace, 'Ubuntu Mono', 'Liberation Mono', monospace" font-size="11.5">Second 2B</text>

    <!-- Commentary Prose with tspan layout -->
    <text x="20" y="84" fill="#f1ebd9" font-family="'Inter', 'Lato', -apple-system, sans-serif" font-size="15.5" font-weight="600">
      <tspan>Places the </tspan><tspan fill="#ffffff" font-weight="700">knight</tspan><tspan> on </tspan><tspan fill="#cbd5e1" font-family="ui-monospace, 'Ubuntu Mono', monospace" text-decoration="underline">d5</tspan><tspan> and opens the </tspan><tspan fill="#cbd5e1" font-family="ui-monospace, 'Ubuntu Mono', monospace" text-decoration="underline">e-file</tspan><tspan>.</tspan>
    </text>

    <text x="20" y="114" fill="#e2e8f0" font-family="'Inter', 'Lato', -apple-system, sans-serif" font-size="14">
      <tspan>Black must answer the threat after </tspan><tspan fill="#e5c07b" font-family="ui-monospace, 'Ubuntu Mono', monospace" font-weight="600" text-decoration="underline">14...Nxd5</tspan><tspan> before</tspan>
    </text>
    <text x="20" y="138" fill="#e2e8f0" font-family="'Inter', 'Lato', -apple-system, sans-serif" font-size="14">completing kingside development.</text>

    <!-- Bottom Island Bar -->
    <rect x="20" y="174" width="414" height="42" rx="10" fill="#121316" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle cx="38" cy="195" r="4" fill="#34d399"/>
    <text x="50" y="199" fill="#94a3b8" font-family="ui-monospace, 'Ubuntu Mono', 'Liberation Mono', monospace" font-size="11.5">Local WASM · Zero cloud prompts</text>
    <rect x="364" y="182" width="58" height="26" rx="6" fill="#252834" stroke="#363b4c" stroke-width="1"/>
    <text x="393" y="199" text-anchor="middle" fill="#e2e8f0" font-family="'Inter', 'Lato', sans-serif" font-size="11.5" font-weight="600">Longer</text>
  </g>
</svg>
